[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngi-n83624-battery-simulator"
version = "0.2.0"
description = "Production-oriented Python driver for the NGI N83624 battery simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandr Chasnyk" }]
keywords = ["NGI", "N83624", "SCPI", "battery simulator", "instrument driver", "PyVISA", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyserial>=3.5",
    "pyvisa>=1.14",
]

[project.optional-dependencies]
examples = [
    "colorama>=0.4.6",
    "numpy>=1.23",
    "pandas>=2.0",
]
dev = [
    "build>=1.2",
    "hypothesis>=6.168",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4,!=2.5.0",
    "pyvisa-sim>=0.7.1",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/ami3go/NGI-N83624-Battery-simulator"
Documentation = "https://github.com/ami3go/NGI-N83624-Battery-simulator/tree/main/Docs"
Repository = "https://github.com/ami3go/NGI-N83624-Battery-simulator"
Issues = "https://github.com/ami3go/NGI-N83624-Battery-simulator/issues"

[tool.setuptools]
packages = ["N83624", "Functions", "ngi_n83624"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 30
session_timeout = 300
markers = [
    "property: Hypothesis property-based validation and command tests",
    "integration: hardware-free transport integration tests",
    "hardware: tests requiring a physical NGI N83624",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "build", "dist", ".idea"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["ngi_n83624"]

[tool.coverage.report]
show_missing = true
fail_under = 80
