[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngi-n83624-battery-simulator"
version = "0.1.0"
description = "Installable Python support package for NGI N83624 battery simulator scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandr Chasnyk" }]
keywords = ["NGI", "N83624", "SCPI", "battery simulator", "instrument driver", "PyVISA", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "colorama>=0.4.6",
    "numpy>=1.23",
    "pyserial>=3.5",
    "pyvisa>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/ami3go/NGI-N83624-Battery-simulator"
Documentation = "https://github.com/ami3go/NGI-N83624-Battery-simulator/tree/main/Docs"
Repository = "https://github.com/ami3go/NGI-N83624-Battery-simulator"
Issues = "https://github.com/ami3go/NGI-N83624-Battery-simulator/issues"

[tool.setuptools]
packages = ["N83624", "Functions", "ngi_n83624"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "build", "dist", ".idea"]
