name: Python package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Authenticate for the private scpi-driver-core dependency
        # scpi-driver-core is a private repo; pip's git clone of it needs a
        # token with read access. Requires a SCPI_DRIVER_CORE_TOKEN repo
        # secret (a PAT, or a GitHub App installation token) with at least
        # read access to ami3go/scpi-driver-core.
        run: |
          git config --global url."https://x-access-token:${SCPI_DRIVER_CORE_TOKEN}@github.com/ami3go/scpi-driver-core".insteadOf "https://github.com/ami3go/scpi-driver-core"
        env:
          SCPI_DRIVER_CORE_TOKEN: ${{ secrets.SCPI_DRIVER_CORE_TOKEN }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile packages
        run: python -m compileall N83624 Functions ngi_n83624

      - name: Run tests
        run: pytest
